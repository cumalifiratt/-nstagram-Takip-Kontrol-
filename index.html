<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <title>Takip Kontrolü</title>
  <style>
    :root { --bg:#101827; --card:#182235; --soft:#26334a; --text:#f5f7fb; --muted:#9cabc2; --accent:#ff4c84; --ok:#5ed3ae; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:linear-gradient(155deg,#17223a,#0d1320 55%); }
    main { width:min(100%,680px); margin:auto; padding:max(28px,env(safe-area-inset-top)) 18px max(36px,env(safe-area-inset-bottom)); }
    h1 { font-size:clamp(28px,7vw,40px); line-height:1.05; margin:20px 0 10px; letter-spacing:-.04em; }
    .lead,.hint { color:var(--muted); margin:0; }
    .panel { background:rgba(24,34,53,.93); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:20px; margin-top:24px; box-shadow:0 16px 45px rgba(0,0,0,.18); }
    .drop { display:block; border:2px dashed #536581; border-radius:14px; padding:24px 16px; text-align:center; cursor:pointer; transition:.2s; }
    .drop:hover,.drop:focus-within { border-color:var(--accent); background:#202c43; }
    .drop strong { display:block; font-size:18px; margin-bottom:5px; }
    input[type=file] { display:none; }
    .or { color:var(--muted); font-size:13px; text-align:center; margin:14px; }
    textarea { display:block; width:100%; min-height:96px; resize:vertical; border:1px solid #455673; background:#101827; color:var(--text); border-radius:12px; padding:12px; font:inherit; }
    button { appearance:none; border:0; border-radius:12px; padding:14px 16px; width:100%; background:var(--accent); color:white; font:700 16px inherit; cursor:pointer; margin-top:14px; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .note { font-size:13px; color:var(--muted); margin:14px 2px 0; }
    .notice { display:none; border-radius:12px; padding:12px; margin-top:15px; background:#26334a; color:#dce8fb; }
    .notice.success { background:#173b37; color:#c8f8e7; }
    .notice.error { background:#4a2534; color:#ffd9e3; }
    #results { display:none; }
    .summary { display:flex; gap:10px; margin-bottom:14px; }
    .stat { flex:1; padding:13px; border-radius:12px; background:#111a2a; text-align:center; }
    .stat b { display:block; font-size:24px; color:var(--ok); }
    .toolbar { display:flex; gap:10px; align-items:center; margin:10px 0 12px; }
    #search { flex:1; min-width:0; background:#101827; color:var(--text); border:1px solid #455673; border-radius:10px; padding:10px; font:inherit; }
    .toolbar button { width:auto; margin:0; padding:10px 12px; font-size:14px; background:#34435d; }
    ul { list-style:none; padding:0; margin:0; }
    li { margin:8px 0; }
    .profile { display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin:0; padding:13px 14px; text-decoration:none; color:var(--text); background:#222e44; border:1px solid transparent; }
    .profile:hover { border-color:#a8b8d0; }
    .profile.checked { background:#303238; border-color:#625d48; }
    .profile.checked .name { color:#e2d49a; }
    .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,#ff9a57,#e83877,#7659dd); font-weight:800; }
    .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .badge { font-size:12px; color:#e2d49a; white-space:nowrap; }
    .arrow { color:var(--muted); font-size:20px; }
    .empty { color:var(--muted); padding:22px 0; text-align:center; }
  </style>
</head>
<body>
<main>
  <h1>Takip Kontrolü</h1>
  <p class="lead">Takip ettiklerin arasından seni takip etmeyen hesapları bul.</p>

  <section class="panel" id="uploadPanel">
    <label class="drop">
      <strong>Instagram dışa aktarma dosyalarını seç</strong>
      <span class="hint">followers ve following JSON/HTML dosyalarını veya klasörü seç</span>
      <input id="files" type="file" multiple accept=".json,.html,text/html,application/json" />
    </label>
    <p class="or">isteğe bağlı: takip ettiklerin arasına kullanıcı adı ekle</p>
    <textarea id="manual" placeholder="Her satıra takip ettiğiniz bir kullanıcı adı yazın.&#10;Örn: takip_ettigim_kullanici"></textarea>
    <button id="analyse">Analiz et</button>
    <p class="note">Veriler yalnızca bu cihazda, tarayıcınızda işlenir; hiçbir yere gönderilmez.</p>
    <div class="notice" id="notice"></div>
  </section>

  <section class="panel" id="results">
    <div class="summary"><div class="stat"><b id="count">0</b>seni takip etmiyor</div><div class="stat"><b id="followingCount">0</b>takip edilen</div></div>
    <p class="hint">Bir isme dokunduğunda profil Instagram’da açılır.</p>
    <div class="toolbar"><input id="search" placeholder="Listede ara" autocomplete="off" /><button id="copy">Kopyala</button><button id="resetChecks">İşaretleri sıfırla</button></div>
    <ul id="list"></ul>
  </section>
</main>
<script>
  const filesInput = document.querySelector('#files'), manual = document.querySelector('#manual');
  const notice = document.querySelector('#notice'), results = document.querySelector('#results');
  let finalNames = [];
  const storageKey = 'takip-kontrolu-kontrol-edilenler-v1';
  let checkedAccounts = new Set();
  try { checkedAccounts = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]')); } catch { /* Empty storage is fine. */ }
  function saveChecked() { localStorage.setItem(storageKey, JSON.stringify([...checkedAccounts])); }
  const clean = value => String(value || '').trim().replace(/^@/, '').replace(/^https?:\/\/(?:www\.)?instagram\.com\//i,'').replace(/[/?#].*$/,'').toLowerCase();
  function usernameFromHref(href) {
    // Following exports commonly use https://www.instagram.com/_u/username.
    // Keep the final path part instead of treating the `_u` routing segment as a username.
    try {
      const parts = new URL(href, 'https://instagram.com').pathname.split('/').filter(Boolean);
      return clean(parts.filter(part => part !== '_u').at(-1));
    } catch { return clean(href); }
  }
  function setNotice(text, error=false) { notice.textContent=text; notice.className='notice' + (error ? ' error' : ' success'); notice.style.display='block'; }
  function extractJson(data) {
    const names=[];
    const walk = item => {
      if (Array.isArray(item)) return item.forEach(walk);
      if (!item || typeof item !== 'object') return;
      if (Array.isArray(item.string_list_data)) item.string_list_data.forEach(x => {
        const u=usernameFromHref(x.href) || clean(x.value);
        if(u) names.push(u);
      });
      Object.values(item).forEach(walk);
    }; walk(data); return names;
  }
  function extractHtml(text) {
    const doc=new DOMParser().parseFromString(text,'text/html');
    // In following.html the visible anchor text is the full `/_u/username` URL.
    // Read the URL path first, then fall back to the visible text for older exports.
    return [...doc.querySelectorAll('a')].map(a => usernameFromHref(a.href) || clean(a.textContent)).filter(Boolean);
  }
  async function readFiles() {
    const followers=new Set(), following=new Set();
    for (const file of filesInput.files) {
      const name=file.name.toLowerCase(), text=await file.text(); let found=[];
      try { found=name.endsWith('.json') ? extractJson(JSON.parse(text)) : extractHtml(text); } catch { continue; }
      // Instagram export files are conventionally named followers_1 and following.
      if (/followers?/.test(name) && !/following/.test(name)) found.forEach(x=>followers.add(x));
      else if (/following/.test(name)) found.forEach(x=>following.add(x));
    }
    return {followers,following};
  }
  function render() {
    const query=document.querySelector('#search').value.toLowerCase();
    const shown=finalNames.filter(x=>x.includes(query)); const list=document.querySelector('#list');
    list.innerHTML='';
    if (!shown.length) { list.innerHTML='<li class="empty">Sonuç bulunamadı.</li>'; return; }
    shown.forEach(name=> { const li=document.createElement('li'), a=document.createElement('a'), checked=checkedAccounts.has(name);
      // instagram.com is a universal/app link on mobile and opens the installed Instagram app when available.
      a.className='profile' + (checked ? ' checked' : ''); a.href=`https://www.instagram.com/${encodeURIComponent(name)}/`; a.target='_blank'; a.rel='noopener';
      a.innerHTML=`<span class="avatar">${name[0].toUpperCase()}</span><span class="name">@${name}</span>${checked ? '<span class="badge">Kontrol edildi</span>' : ''}<span class="arrow">›</span>`;
      a.addEventListener('click', () => {
        checkedAccounts.add(name); saveChecked();
        a.classList.add('checked');
        if (!a.querySelector('.badge')) a.querySelector('.name').insertAdjacentHTML('afterend', '<span class="badge">Kontrol edildi</span>');
      });
      li.append(a); list.append(li);
    });
  }
  document.querySelector('#analyse').addEventListener('click', async () => {
    const button=document.querySelector('#analyse'); button.disabled=true; button.textContent='Okunuyor…'; notice.style.display='none';
    try {
      const {followers,following}=await readFiles();
      const typed=manual.value.split(/[\n,;]+/).map(clean).filter(Boolean);
      // Manual entries are useful only as a following list; export data is needed to compare followers.
      typed.forEach(x=>following.add(x));
      if (!following.size) throw new Error('“following” dosyası bulunamadı. Dosya seçiciden Instagram dışa aktarma klasörünü veya following dosyasını seçin.');
      if (!followers.size && !typed.length) throw new Error('“followers” dosyası bulunamadı. Takipçi listesi olmadan karşılaştırma yapılamaz.');
      finalNames=[...following].filter(x=>!followers.has(x)).sort((a,b)=>a.localeCompare(b,'tr'));
      document.querySelector('#count').textContent=finalNames.length; document.querySelector('#followingCount').textContent=following.size;
      setNotice(`✓ Dosyalar başarıyla yüklendi: ${followers.size} takipçi ve ${following.size} takip edilen hesap okundu.`);
      results.style.display='block'; render(); results.scrollIntoView({behavior:'smooth',block:'start'});
      if (!followers.size) setNotice('Yalnızca elle girilen isimler gösterildi; doğru karşılaştırma için followers dosyasını da seçin.', true);
    } catch(e) { setNotice(e.message || 'Dosyalar okunamadı.',true); }
    finally { button.disabled=false; button.textContent='Analiz et'; }
  });
  document.querySelector('#search').addEventListener('input',render);
  document.querySelector('#copy').addEventListener('click', async () => { await navigator.clipboard.writeText(finalNames.map(x=>'@'+x).join('\n')); const b=document.querySelector('#copy'); b.textContent='Kopyalandı'; setTimeout(()=>b.textContent='Kopyala',1300); });
  document.querySelector('#resetChecks').addEventListener('click', () => {
    checkedAccounts.clear(); saveChecked(); render(); setNotice('Kontrol edildi işaretleri sıfırlandı.');
  });
</script>
</body>
</html>
