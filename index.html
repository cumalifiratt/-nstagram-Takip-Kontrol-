<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Takip Kontrol</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 20px;
            padding-top: env(safe-area-inset-top);
            color: #1c1e21;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .upload-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .file-input-group {
            margin-bottom: 15px;
        }
        .file-input-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            font-size: 14px;
        }
        .analyze-btn {
            background: #000000;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .analyze-btn:active {
            opacity: 0.8;
        }
        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .user-item {
            background: #ffffff;
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .username {
            font-weight: 500;
            font-size: 16px;
        }
        .user-item.checked {
            opacity: 0.5;
            background-color: #e5e5ea;
        }
        .user-item.checked .username {
            text-decoration: line-through;
            color: #8e8e93;
        }
        .check-btn {
            background: #007aff;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .checked .check-btn {
            background: #34c759;
        }
        #resultHeader {
            display: none;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Takip Kontrol</h2>
    
    <div class="upload-section">
        <div class="file-input-group">
            <label>1. Takipçiler (Followers) Dosyası:</label>
            <input type="file" id="followersFile" accept=".json, .html">
        </div>
        <div class="file-input-group">
            <label>2. Takip Ettiklerin (Following) Dosyası:</label>
            <input type="file" id="followingFile" accept=".json, .html">
        </div>
        <button class="analyze-btn" onclick="analiziBaslat()">Beni Takip Etmeyenleri Bul</button>
    </div>

    <h3 id="resultHeader">Seni Takip Etmeyenler (<span id="unfollowerCount">0</span>)</h3>
    <ul class="user-list" id="userList"></ul>
</div>

<script>
    async function dosyaOku(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve({ content: e.target.result, name: file.name });
            reader.onerror = e => reject(e);
            reader.readAsText(file);
        });
    }

    function isimleriCikar(data) {
        let usernames = new Set();
        const { content, name } = data;

        if (name.endsWith('.json')) {
            const matches = content.match(/"value":\s*"([^"]+)"/g);
            if (matches) {
                matches.forEach(match => {
                    const username = match.replace(/"value":\s*"/, '').replace(/"$/, '');
                    usernames.add(username);
                });
            }
        } else if (name.endsWith('.html')) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            
            // Linklerin içinden sadece kullanıcı adını nokta atışı çıkar
            const links = tempDiv.querySelectorAll('a[href*="instagram.com"]');
            links.forEach(link => {
                const url = link.href;
                // Eğer linkte _u/ varsa bile temizleyip sadece saf kullanıcı adını alır
                const match = url.match(/instagram\.com\/(?:_u\/)?([^/]+)/);
                if (match && match[1]) {
                    usernames.add(match[1].trim());
                }
            });
        }
        return usernames;
    }

    async function analiziBaslat() {
        const followersInput = document.getElementById('followersFile');
        const followingInput = document.getElementById('followingFile');
        const userList = document.getElementById('userList');
        const resultHeader = document.getElementById('resultHeader');
        const countSpan = document.getElementById('unfollowerCount');

        if (!followersInput.files[0] || !followingInput.files[0]) {
            alert('Lütfen her iki dosyayı da seçin!');
            return;
        }

        userList.innerHTML = '<div style="text-align:center; padding: 20px;">Analiz ediliyor...</div>';

        try {
            const followersData = await dosyaOku(followersInput.files[0]);
            const followingData = await dosyaOku(followingInput.files[0]);

            const followersSet = isimleriCikar(followersData);
            const followingSet = isimleriCikar(followingData);

            let unfollowers = [];
            followingSet.forEach(user => {
                if (!followersSet.has(user)) {
                    unfollowers.push(user);
                }
            });

            userList.innerHTML = '';
            countSpan.innerText = unfollowers.length;
            resultHeader.style.display = 'block';

            if (unfollowers.length === 0) {
                userList.innerHTML = '<div style="text-align:center; padding: 20px; font-weight:bold; color:#34c759;">Tebrikler! Takip ettiğin herkes seni takip ediyor.</div>';
                return;
            }

            unfollowers.forEach(username => {
                const li = document.createElement('li');
                li.className = 'user-item';
                
                if (localStorage.getItem('checked_' + username)) {
                    li.classList.add('checked');
                }

                li.innerHTML = `
                    <span class="username">${username}</span>
                    <a href="https://instagram.com/${username}" target="_blank" class="check-btn" data-username="${username}">
                        ${localStorage.getItem('checked_' + username) ? 'Bakıldı' : 'Kontrol Et'}
                    </a>
                `;
                userList.appendChild(li);
            });

            document.querySelectorAll('.check-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const username = this.getAttribute('data-username');
                    const listItem = this.closest('.user-item');
                    
                    localStorage.setItem('checked_' + username, 'true');
                    listItem.classList.add('checked');
                    this.innerText = 'Bakıldı';
                });
            });

        } catch (error) {
            alert('Dosyalar okunurken bir hata oluştu.');
            console.error(error);
        }
    }
</script>

</body>
</html>
