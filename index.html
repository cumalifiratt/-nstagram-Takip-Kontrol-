<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram Analiz Premium</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --radius: 20px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --avatar-bg: #e0e7ff;
            --avatar-text: #4f46e5;
            --filter-bg: #f1f5f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
                --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
                --avatar-bg: #3730a3;
                --avatar-text: #e0e7ff;
                --filter-bg: #0f172a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-top: calc(env(safe-area-inset-top) + 20px);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 700;
            font-size: 28px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        /* Upload Area */
        .upload-group {
            margin-bottom: 16px;
        }

        .upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-color);
            border: 2px dashed var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
        }

        .upload-label:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--avatar-bg);
        }

        .upload-label i {
            font-size: 20px;
        }

        input[type="file"] {
            display: none;
        }

        /* Primary Button */
        .btn-primary {
            background: var(--gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Dashboard */
        .dashboard {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        
        .stat-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--gradient);
            opacity: 0.8;
        }

        .stat-box.full { grid-column: span 2; }

        .stat-box .num {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .stat-box .label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Tabs */
        .main-tabs {
            display: none;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .main-tab-btn {
            flex: 1 1 30%;
            padding: 12px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .main-tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        /* Tools */
        .tools {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-bar {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 15px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
        }

        .action-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap; /* Telefondaki dar ekranda alt alta inmesini sağlar */
        }

        .action-btn {
            flex: 1 1 calc(33% - 12px);
            min-width: 120px; /* Butonların çok küçülmesini engeller */
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            color: white;
        }

        .export-btn { 
            background: var(--success); 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .export-btn:hover { background: #059669; }
        
        .mark-all-btn { 
            background: var(--primary); 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        .mark-all-btn:hover { background: var(--primary-hover); }

        .reset-btn { 
            background: var(--danger); 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .reset-btn:hover { background: var(--danger-hover); }

        /* Filters */
        .filter-group {
            display: none;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            justify-content: space-between;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--filter-bg);
            color: var(--text-main);
        }

        /* List */
        .user-list { list-style: none; }

        .user-item {
            background: var(--card-bg);
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .user-item:hover {
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--avatar-bg);
            color: var(--avatar-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
        }

        .username { 
            font-weight: 600; 
            font-size: 15px; 
            color: var(--text-main);
        }

        .user-item.checked { opacity: 0.6; }
        .user-item.checked .username {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: white;
            font-size: 14px;
        }

        .btn-visit { background: var(--primary); }
        .btn-visit:hover { background: var(--primary-hover); }

        .btn-mark { background: var(--border); color: var(--text-main); }
        .btn-mark:hover { background: #d1d5db; }
        
        @media (prefers-color-scheme: dark) {
            .btn-mark:hover { background: #475569; }
        }

        .checked .btn-mark { 
            background: var(--success); 
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Takip Kontrol Premium</h1>
        <p>Instagram takipçi analizinizi profesyonelce yapın.</p>
    </div>
    
    <div class="card">
        <div class="upload-group">
            <label class="upload-label" for="followersFile">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span id="followersName" data-default="1. Takipçiler (Followers) Dosyası">1. Takipçiler (Followers) Dosyası</span>
                <input type="file" id="followersFile" accept=".json, .html" onchange="updateFileName(this, 'followersName')">
            </label>
        </div>
        <div class="upload-group">
            <label class="upload-label" for="followingFile">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span id="followingName" data-default="2. Takip Ettiklerin (Following) Dosyası">2. Takip Ettiklerin (Following) Dosyası</span>
                <input type="file" id="followingFile" accept=".json, .html" onchange="updateFileName(this, 'followingName')">
            </label>
        </div>
        <button class="btn-primary" onclick="analiziBaslat()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Analizi Başlat
        </button>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="stat-box full">
            <div class="num" id="statRatio">%0</div>
            <div class="label"><i class="fa-solid fa-chart-pie"></i> Geri Takip Oranı</div>
        </div>
        <div class="stat-box">
            <div class="num" id="statFollowing">0</div>
            <div class="label"><i class="fa-solid fa-user-plus"></i> Takip Ettiğin</div>
        </div>
        <div class="stat-box">
            <div class="num" id="statFollowers">0</div>
            <div class="label"><i class="fa-solid fa-users"></i> Takipçin</div>
        </div>
    </div>

    <!-- Ana Sekmeler -->
    <div class="main-tabs" id="mainTabs">
        <button class="main-tab-btn active" data-maintab="unfollowers">Takip Etmeyenler (<span id="countUnfollowers">0</span>)</button>
        <button class="main-tab-btn" data-maintab="fans">Hayranlar (<span id="countFans">0</span>)</button>
        <button class="main-tab-btn" data-maintab="mutuals">Karşılıklı (<span id="countMutuals">0</span>)</button>
    </div>

    <!-- Araçlar: Arama & Butonlar -->
    <div class="tools" id="toolsGroup">
        <div class="search-container">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" class="search-bar" placeholder="Kullanıcı ara..." onkeyup="listeyiRenderEt()">
        </div>
        <div class="action-btns">
            <button class="action-btn export-btn" onclick="disaAktar()">
                <i class="fa-solid fa-download"></i> İndir (.txt)
            </button>
            <button class="action-btn mark-all-btn" onclick="tumunuIsaretle()">
                <i class="fa-solid fa-check-double"></i> Tümünü İşaretle
            </button>
            <button class="action-btn reset-btn" onclick="hafizayiSifirla()">
                <i class="fa-solid fa-trash-can"></i> Hafızayı Sıfırla
            </button>
        </div>
    </div>
    
    <!-- Filtre Alanı -->
    <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-filter="all">Tümü</button>
        <button class="filter-btn" data-filter="unchecked">Bakılmayanlar</button>
        <button class="filter-btn" data-filter="checked">Bakılanlar</button>
    </div>

    <ul class="user-list" id="userList"></ul>
</div>

<script>
    let currentFilter = 'all'; 
    let activeMainTab = 'unfollowers';
    
    let globalUnfollowers = [];
    let globalFans = [];
    let globalMutuals = [];

    // Dosya ismi güncelleme efekti
    function updateFileName(input, targetId) {
        const target = document.getElementById(targetId);
        const labelBox = input.closest('.upload-label');
        if (input.files.length > 0) {
            target.innerText = input.files[0].name;
            target.style.color = "var(--primary)";
            labelBox.style.borderColor = "var(--primary)";
            labelBox.style.background = "var(--avatar-bg)";
        } else {
            target.innerText = target.getAttribute('data-default');
            target.style.color = "var(--text-muted)";
            labelBox.style.borderColor = "var(--border)";
            labelBox.style.background = "var(--bg-color)";
        }
    }

    async function dosyaOku(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve({ content: e.target.result, name: file.name });
            reader.onerror = e => reject(e);
            reader.readAsText(file);
        });
    }

    function isimleriCikar(data) {
        let usernames = new Set();
        const { content, name } = data;

        if (name.endsWith('.json')) {
            const matches = content.match(/"value":\s*"([^"]+)"/g);
            if (matches) {
                matches.forEach(match => {
                    const username = match.replace(/"value":\s*"/, '').replace(/"$/, '');
                    usernames.add(username);
                });
            }
        } else if (name.endsWith('.html')) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            
            const links = tempDiv.querySelectorAll('a[href*="instagram.com"]');
            links.forEach(link => {
                const url = link.href;
                const match = url.match(/instagram\.com\/(?:_u\/)?([^/]+)/);
                if (match && match[1]) {
                    usernames.add(match[1].trim());
                }
            });
        }
        return usernames;
    }

    // Event Listeners (Filtreler ve Sekmeler)
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.getAttribute('data-filter');
            listeyiRenderEt();
        });
    });

    document.querySelectorAll('.main-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            activeMainTab = this.getAttribute('data-maintab');
            listeyiRenderEt();
        });
    });

    async function analiziBaslat() {
        const followersInput = document.getElementById('followersFile');
        const followingInput = document.getElementById('followingFile');
        const userList = document.getElementById('userList');

        if (!followersInput.files[0] || !followingInput.files[0]) {
            alert('Lütfen her iki dosyayı da (Takipçiler ve Takip Ettikleriniz) seçin!');
            return;
        }

        userList.innerHTML = '<div style="text-align:center; padding: 30px; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Analiz ediliyor...</div>';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('mainTabs').style.display = 'none';
        document.getElementById('filterGroup').style.display = 'none';
        document.getElementById('toolsGroup').style.display = 'none';

        try {
            const followersData = await dosyaOku(followersInput.files[0]);
            const followingData = await dosyaOku(followingInput.files[0]);

            const followersSet = isimleriCikar(followersData);
            const followingSet = isimleriCikar(followingData);

            globalUnfollowers = [];
            globalFans = [];
            globalMutuals = [];

            // Analiz İşlemleri
            followingSet.forEach(user => {
                if (!followersSet.has(user)) globalUnfollowers.push(user);
                else globalMutuals.push(user);
            });

            followersSet.forEach(user => {
                if (!followingSet.has(user)) globalFans.push(user);
            });

            // Dashboard Güncelleme
            document.getElementById('statFollowing').innerText = followingSet.size;
            document.getElementById('statFollowers').innerText = followersSet.size;
            
            let ratio = followingSet.size > 0 ? ((globalMutuals.length / followingSet.size) * 100).toFixed(1) : 0;
            document.getElementById('statRatio').innerText = "%" + ratio;

            document.getElementById('countUnfollowers').innerText = globalUnfollowers.length;
            document.getElementById('countFans').innerText = globalFans.length;
            document.getElementById('countMutuals').innerText = globalMutuals.length;

            // UI Elemanlarını Göster
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('mainTabs').style.display = 'flex';
            document.getElementById('filterGroup').style.display = 'flex';
            document.getElementById('toolsGroup').style.display = 'flex';

            listeyiRenderEt();

        } catch (error) {
            alert('Dosyalar okunurken bir hata oluştu. Doğru dosyaları seçtiğinizden emin olun.');
            console.error(error);
        }
    }

    function listeyiRenderEt() {
        const userList = document.getElementById('userList');
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        
        let currentData = [];
        if (activeMainTab === 'unfollowers') currentData = globalUnfollowers;
        else if (activeMainTab === 'fans') currentData = globalFans;
        else if (activeMainTab === 'mutuals') currentData = globalMutuals;

        userList.innerHTML = '';
        
        if (currentData.length === 0) {
            userList.innerHTML = '<div style="text-align:center; padding: 40px; color:var(--success);"><i class="fa-solid fa-circle-check fa-3x"></i><br><br>Harika! Bu listede kimse yok.</div>';
            return;
        }

        let displayedCount = 0;

        currentData.forEach(username => {
            const isChecked = localStorage.getItem('checked_' + username) !== null;
            
            // Filtre kontrolü
            if (currentFilter === 'unchecked' && isChecked) return;
            if (currentFilter === 'checked' && !isChecked) return;
            
            // Arama kontrolü
            if (searchQuery && !username.toLowerCase().includes(searchQuery)) return;

            displayedCount++;
            
            // Baş harf al (Avatar için)
            const initial = username.charAt(0).toUpperCase();

            const li = document.createElement('li');
            li.className = 'user-item' + (isChecked ? ' checked' : '');
            
            li.innerHTML = `
                <div class="user-info">
                    <div class="avatar">${initial}</div>
                    <span class="username">${username}</span>
                </div>
                <div class="item-actions">
                    <a href="https://instagram.com/${username}" target="_blank" class="icon-btn btn-visit" title="Profile Git">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                    <button class="icon-btn btn-mark action-mark" data-username="${username}" title="${isChecked ? 'İşareti Kaldır' : 'Bakıldı Olarak İşaretle'}">
                        <i class="fa-solid ${isChecked ? 'fa-check-double' : 'fa-check'}"></i>
                    </button>
                </div>
            `;
            userList.appendChild(li);
        });

        if (displayedCount === 0) {
            userList.innerHTML = '<div style="text-align:center; padding: 30px; color:var(--text-muted);"><i class="fa-solid fa-ghost fa-2x"></i><br><br>Aradığınız kriterlere uygun kimse bulunamadı.</div>';
        }

        // İşaretleme İşlemleri
        document.querySelectorAll('.action-mark').forEach(btn => {
            btn.addEventListener('click', function() {
                const username = this.getAttribute('data-username');
                if (localStorage.getItem('checked_' + username)) {
                    localStorage.removeItem('checked_' + username);
                } else {
                    localStorage.setItem('checked_' + username, 'true');
                }
                // Anında yenile
                listeyiRenderEt();
            });
        });
    }

    function tumunuIsaretle() {
        if (confirm("Şu anki listede yer alan herkes 'Bakıldı' olarak işaretlenecek. Emin misiniz?")) {
            let currentData = [];
            if (activeMainTab === 'unfollowers') currentData = globalUnfollowers;
            else if (activeMainTab === 'fans') currentData = globalFans;
            else if (activeMainTab === 'mutuals') currentData = globalMutuals;
            
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            currentData.forEach(username => {
                // Sadece arama kriterine uyanları işaretler (Arama kutusu doluysa)
                if (searchQuery && !username.toLowerCase().includes(searchQuery)) return;
                
                localStorage.setItem('checked_' + username, 'true');
            });
            
            listeyiRenderEt();
        }
    }

    function hafizayiSifirla() {
        if (confirm("İşaretlediğiniz tüm kişilerin hafızası silinecek. Emin misiniz?")) {
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('checked_')) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            alert("Hafıza başarıyla temizlendi!");
            listeyiRenderEt();
        }
    }

    function disaAktar() {
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        let currentData = [];
        let tabName = "";
        
        if (activeMainTab === 'unfollowers') { currentData = globalUnfollowers; tabName = "TakipEtmeyenler"; }
        else if (activeMainTab === 'fans') { currentData = globalFans; tabName = "Hayranlar"; }
        else if (activeMainTab === 'mutuals') { currentData = globalMutuals; tabName = "Karsilikli"; }

        let textContent = `--- Instagram ${tabName} Listesi ---\n\n`;
        
        let count = 0;
        currentData.forEach(username => {
            const isChecked = localStorage.getItem('checked_' + username) !== null;
            if (currentFilter === 'unchecked' && isChecked) return;
            if (currentFilter === 'checked' && !isChecked) return;
            if (searchQuery && !username.toLowerCase().includes(searchQuery)) return;
            
            textContent += username + (isChecked ? " (İşaretlendi)" : "") + "\n";
            count++;
        });

        textContent = `Toplam Kişi Sayısı: ${count}\n\n` + textContent;

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Instagram_${tabName}_Listesi.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
